[tools]
"github:cli/cli" = "latest"
ghq = "latest"
"github:k1LoW/git-wt" = "latest"
peco = "latest"
"github:yusukebe/ax" = "latest"
rust = "latest"
node = "lts"
ruby = "latest"
yarn = "1.22.19"
colima = "latest"
"github:hokaccha/givy" = "latest"
"github:sorah/mairu" = "latest"
"github:tokuhirom/mdroll" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
codex = "latest"
apm = "0.30.0"
watchexec = "2.7.2"

[settings]
github_attestations = false
idiomatic_version_file_enable_tools = ["node", "ruby", "rust"]

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.services.apm-watch]
scope = "user"
command = "~/.local/bin/mise exec -- ruby bin/apm-apply --watch"
working_directory = "~"
requires_tools = true
environment = { RUBYOPT = "-EUTF-8" }

[tasks."apm:apply"]
description = "Install APM dependencies and rebuild user instructions"
dir = "~"
env = { RUBYOPT = "-EUTF-8" }
run = "ruby \"$HOME/bin/apm-apply\""

[dotfiles]
"~/.apm/apm.yml" = { mode = "track" }
"~/.apm/instructions/base.instructions.md" = { mode = "track" }
"~/.apm/instructions/debugging.instructions.md" = { mode = "track" }
"~/.apm/instructions/git-workflow.instructions.md" = { mode = "track" }
"~/.apm/instructions/github-cli.instructions.md" = { mode = "track" }
"~/.apm/instructions/installer.instructions.md" = { mode = "track" }
"~/.apm/instructions/shell.instructions.md" = { mode = "track" }
"~/.apm/instructions/testing.instructions.md" = { mode = "track" }
"~/.claude/scripts" = { mode = "track" }
"~/.claude/settings.json" = { mode = "track" }
"~/.config/ghostty" = { mode = "track" }
"~/.config/herdr/config.toml" = { mode = "track", variants = [{ os = "macos" }, { os = "linux" }] }
"~/.config/htop" = { mode = "track" }
"~/.config/karabiner" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/nvim" = { mode = "track" }
"~/.config/peco" = { mode = "track" }
"~/.config/qmd/index.yml" = { mode = "track" }
"~/.config/rubocop" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.gemrc" = { mode = "track" }
"~/.gitconfig" = { mode = "track" }
"~/.gitignore" = { mode = "track" }
"~/.irbrc" = { mode = "track" }
"~/.psqlrc" = { mode = "track" }
"~/.skhdrc" = { mode = "track" }
"~/.tigrc" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.yabairc" = { mode = "track" }
"~/.zshrc" = { mode = "track" }
"~/bin/apm-apply" = { mode = "track" }
"~/bin/check_sip.sh" = { mode = "track" }
"~/bin/fix_agent_frontmatter" = { mode = "track" }
"~/bin/fix_codex_agent_description" = { mode = "track" }
"~/bin/herdr-focus-attention" = { mode = "track" }
"~/bin/herdr-fork-claude-session" = { mode = "track" }
"~/bin/herdr-fork-codex-session" = { mode = "track" }
"~/bin/hw" = { mode = "track" }
"~/bin/install_gist_skills" = { mode = "track" }
"~/bin/mdroll-in-herdr" = { mode = "track" }
"~/bin/setup_workspace" = { mode = "track" }

[history]
exclude = ["~/.config/nvim/.netrwhist", "~/.config/karabiner/automatic_backups/**"]
