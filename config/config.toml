[tools]
"github:cli/cli" = "latest"
ghq = "latest"
"github:k1LoW/git-wt" = "latest"
peco = "latest"
"github:yusukebe/ax" = "latest"
rust = { version = "latest", mr_boxington = true }
node = "lts"
ruby = "latest"
colima = { version = "latest", os = ["linux", "macos"] }
"github:sorah/mairu" = { version = "latest", os = ["linux", "macos"] }
"github:tokuhirom/mdroll" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
codex = "latest"
apm = "latest"
watchexec = "latest"
claude = "latest"
"npm:@tobilu/qmd" = "latest"
"npm:pnpm" = "12.9.1"
mr-boxington = "latest"
"npm:defuddle" = "latest"
"github:moznion/cccc" = "latest"
uv = "latest"

[settings]
github_attestations = false
idiomatic_version_file_enable_tools = ["node", "ruby", "rust"]
self_update.auto = true
minimum_release_age_excludes = ["codex"]

[settings.tool_update]
global_auto = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.services.apm-watch]
scope = "user"
command = "~/.local/bin/mise exec -- ruby bin/apm-apply --watch-manifest"
working_directory = "~"
requires_tools = true
environment = { RUBYOPT = "-EUTF-8" }

[bootstrap.services.apm-instructions-watch]
scope = "user"
command = "~/.local/bin/mise exec -- ruby bin/apm-apply --watch-instructions"
working_directory = "~"
requires_tools = true
environment = { RUBYOPT = "-EUTF-8" }

[tasks.update]
description = "Upgrade mise tools and update APM skills"
dir = "~"
raw = true
run = ["mise upgrade", { task = "apm:update" }]

[tasks."apm:update"]
description = "Update APM skills and rebuild user instructions"
dir = "~"
raw = true
run = ["apm update --global --target claude,cursor,codex", { task = "apm:apply" }]

[tasks."apm:apply"]
description = "Install APM dependencies and rebuild user instructions"
dir = "~"
env = { RUBYOPT = "-EUTF-8" }
run = "ruby \"$HOME/bin/apm-apply\""
run_windows = 'ruby bin/apm-apply'

[tasks."herdr:plugins"]
description = "Install pinned Herdr plugins"
dir = "~"
run = "ruby \"$HOME/bin/herdr-plugins-apply\""

[tasks.bootstrap]
run = [{ task = "apm:apply" }, { task = "herdr:plugins" }]
run_windows = [{ task = "apm:apply" }]

# Track authored sources only. Generated agent outputs and mixed-state
# directories such as ~/.claude/skills and ~/.zsh.d are intentionally excluded.
